name: fork-pr-test
on: pull_request
permissions:
  contents: read
  id-token: write
  actions: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: env
        run: |
          echo "EVENT=${{ github.event_name }} REF=${{ github.ref }} REPO=${{ github.repository }} ACTOR=${{ github.actor }}"
      - name: oidc
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then echo "OIDC_ENV_ABSENT"; else
            RESP=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=test-aud")
            TOKEN=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('value',''))" 2>/dev/null)
            if [ -n "$TOKEN" ]; then echo "OIDC_TOKEN_OK"; echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null; echo; else echo "OIDC_FAIL=$RESP"; fi
          fi
      - name: cache save
        continue-on-error: true
        run: |
          mkdir -p /tmp/fp && echo "FORK-POISON-c93a" > /tmp/fp/x.txt
      - uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: /tmp/fp
          key: fork-poison-key
